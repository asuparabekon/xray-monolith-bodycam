name: MSBuild

on:
  push:
    branches: [ "bodycam-mt" ]
  workflow_dispatch:

permissions: write-all

env:
  SOLUTION_FILE_PATH: src/engine-vs2022.sln
  BUILD_CONF: DX11-AVX
  PACK_GAMEDATA_NAME: 00_modded_exes_gamedata.db0

jobs:
  pack_gamedata:
    name: pack_gamedata
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Pack gamedata
      run: |
        new-item -path "./compressor/gamedata" -itemtype directory -force
        copy-item -path "./gamedata/*" -destination "./compressor/gamedata" -recurse -force
        cd ./compressor
        start-process -filepath "./! compress_gamedata.cmd" -Wait
        rename-item -path gamedata.db0 -newname ${{env.PACK_GAMEDATA_NAME}}

    - name: Upload gamedata
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{env.PACK_GAMEDATA_NAME}}
        path: ./compressor/${{env.PACK_GAMEDATA_NAME}}
        if-no-files-found: "error"
        retention-days: 1

  build_mt:
    name: build-mt-dx11-avx
    runs-on: windows-latest

    steps:
    - name: Configure Pagefile
      uses: al-cheb/configure-pagefile-action@v1.3
      with:
        minimum-size: 8GB
        maximum-size: 8GB
        disk-root: "C:"

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Init submodules
      uses: snickerbockers/submodules-init@v4

    - name: setup-msbuild
      uses: microsoft/setup-msbuild@v1.3.1
      with:
        msbuild-architecture: "x64"

    - name: Build DX11-AVX
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=${{env.BUILD_CONF}} ${{env.SOLUTION_FILE_PATH}}

    - name: Upload Exe
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{env.BUILD_CONF}}_mt_exe
        path: ./_build/_game/bin_dbg/*.exe
        if-no-files-found: "error"
        retention-days: 1

    - name: Zip PDB
      run: |
        cd ./_build/_game/bin_dbg
        compress-archive -DestinationPath "STALKER-Anomaly-modded-exes_${{env.BUILD_CONF}}_mt_pdb.zip" -Path "./*.pdb"

    - name: Upload PDB
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{env.BUILD_CONF}}_mt_pdb
        path: ./_build/_game/bin_dbg/*.zip
        if-no-files-found: "error"
        retention-days: 1

  release:
    needs: [pack_gamedata, build_mt]
    name: Release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Get Datetime
      id: datetime
      run: echo "today=$(date +'%-Y.%-m.%-d')" >> "$GITHUB_OUTPUT"

    - name: Download artifacts
      uses: actions/download-artifact@v4.1.8

    - name: Zip release
      run: |
        mkdir release_mt
        mkdir release_mt/bin
        mkdir release_mt/db
        mkdir release_mt/db/mods

        mv ${{env.PACK_GAMEDATA_NAME}}/*.db0 release_mt/db/mods
        mv ${{env.BUILD_CONF}}_mt_exe/*.exe release_mt/bin
        unzip ${{env.BUILD_CONF}}_mt_pdb/*.zip -d release_mt/bin

        cd release_mt
        zip -r 'STALKER-Anomaly-modded-exes-MT-TEST_DX11-AVX_${{steps.datetime.outputs.today}}.zip' ./*
        mv 'STALKER-Anomaly-modded-exes-MT-TEST_DX11-AVX_${{steps.datetime.outputs.today}}.zip' ../

    - name: Move PDBs to folder
      run: |
        mkdir pdb
        mv ${{env.BUILD_CONF}}_mt_pdb/*.zip pdb

    - name: Publish
      uses: softprops/action-gh-release@v2.3.2
      with:
        files: |
          *.zip
          pdb/*.zip
        tag_name: "${{steps.datetime.outputs.today}}-bodycam-mt"
        name: "${{steps.datetime.outputs.today}} Bodycam MT"
        body: |
          ## What's Changed
          * Added engine-level Bodycam camera and viewmodel module for the MT DX11-AVX build.
          * Added dynamic viewmodel lowering for walk states.
          * Added Peak Volumetrics shader support in the DX11 renderer path.
          * Defaulted Bodycam impulse debug logging to off.

          ## Build
          * DX11-AVX MT only. This is the only configuration tested.
        token: "${{ secrets.GITHUB_TOKEN }}"

    - name: Remove artifacts
      uses: c-hive/gha-remove-artifacts@v1.2.0
      with:
        age: "1 second"
